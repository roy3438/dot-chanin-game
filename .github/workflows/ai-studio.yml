name: AI Studio Integrated Development

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: studio-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == (vars.STUDIO_OWNER || github.repository_owner) &&
      (startsWith(github.event.comment.body, '/studio plan ') ||
      startsWith(github.event.comment.body, '/studio approve ') ||
      startsWith(github.event.comment.body, '/studio retry '))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Identify approved retry
        id: resume
        shell: python
        run: |
          import json, os, re
          with open(os.environ["GITHUB_EVENT_PATH"]) as event:
              body = json.load(event)["comment"]["body"].strip()
          match = re.fullmatch(r"/studio retry ([1-9][0-9]{0,19}) groq-step-2", body)
          if match:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print("approval=" + match[1], file=output)
      - name: Restore approved candidate
        if: steps.resume.outputs.approval != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_CHECKPOINT: ${{ runner.temp }}/studio-checkpoint
          CHECKPOINT_NAME: studio-${{ github.sha }}-${{ github.event.issue.number }}-${{ steps.resume.outputs.approval }}
        run: python3 -I scripts/studio/checkpoint_artifact.py restore
      - name: Run studio
        env:
          STUDIO_CHECKPOINT: ${{ runner.temp }}/studio-checkpoint
          GH_TOKEN: ${{ github.token }}
          STUDIO_REPAIR_BYTES: ${{ vars.STUDIO_REPAIR_BYTES }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COLLAB_MODEL: ${{ vars.COLLAB_MODEL }}
          STUDIO_OWNER: ${{ vars.STUDIO_OWNER || github.repository_owner }}
        run: python3 -I -B scripts/studio/engine.py
      - name: Seal candidate on failure
        id: seal
        if: failure() && steps.resume.outputs.approval != ''
        env:
          STUDIO_CHECKPOINT: ${{ runner.temp }}/studio-checkpoint
        run: |
          if test -f "$STUDIO_CHECKPOINT/candidate.json"; then
            python3 -I scripts/studio/checkpoint_artifact.py seal
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve candidate for explicit retry
        if: failure() && steps.seal.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-${{ github.sha }}-${{ github.event.issue.number }}-${{ steps.resume.outputs.approval }}
          path: ${{ runner.temp }}/studio-checkpoint/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
