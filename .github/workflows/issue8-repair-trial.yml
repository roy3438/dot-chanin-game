name: Issue 8 bounded repair trial
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  replay:
    if: >-
      github.run_attempt == 1 && github.event.before == '258e28fc9ef7a95d40016e37bdc3bea4a229d1d6' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'studio/repair-from-evidence' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 23
            revision: c375a2ada1475d00df11d75155f3407f1521aff0
          - pr: 24
            revision: 379e9caafa14b184e179bbbdce335c1fd576d6c6
    name: Review PR ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read exact game revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ matrix.revision }}
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          for file in index.html script.js style.css; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$file?ref=$REVISION" > "$RUNNER_TEMP/candidate/$file"
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/7091487940" > "$RUNNER_TEMP/plan.json"
      - name: Run original and continuity cases
        run: |
          PYTHONPATH=scripts/studio python3 - <<'PY'
          import base64, engine, json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          comment = json.loads((temp / "plan.json").read_text())
          assert comment["id"] == 7091487940 and comment["user"]["login"] == engine.BOT
          plan = json.loads(base64.b64decode(comment["body"].split("\n    studio-data ")[-1], validate=True))["plan"]
          assets = {file.name:file.read_bytes() for file in (temp / "candidate").iterdir()}
          tests = [*plan["tests"], engine.level_two_negative(plan), *engine.level_continuity_cases()]
          passed, log = engine.run_qa(assets, dict(plan, tests=tests, dot_chain_regression=True))
          print(log, flush=True)
          raise SystemExit(0 if passed else 1)
          PY
