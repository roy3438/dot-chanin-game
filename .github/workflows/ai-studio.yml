name: AI Studio Integrated Development

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: studio-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == (vars.STUDIO_OWNER || github.repository_owner) &&
      (startsWith(github.event.comment.body, '/studio plan ') ||
      startsWith(github.event.comment.body, '/studio approve ') ||
      startsWith(github.event.comment.body, '/studio retry '))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Identify approved retry
        id: resume
        shell: python
        run: |
          import json, os, re
          with open(os.environ["GITHUB_EVENT_PATH"]) as event:
              body = json.load(event)["comment"]["body"].strip()
          match = re.fullmatch(r"/studio retry ([1-9][0-9]{0,19}) groq-step-2", body)
          if match:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print("approval=" + match[1], file=output)
      - name: Restore approved candidate
        if: steps.resume.outputs.approval != ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/studio-checkpoint
          key: studio-v1-${{ github.sha }}-${{ github.event.issue.number }}-${{ steps.resume.outputs.approval }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            studio-v1-${{ github.sha }}-${{ github.event.issue.number }}-${{ steps.resume.outputs.approval }}-
      - name: Run studio
        env:
          STUDIO_CHECKPOINT: ${{ runner.temp }}/studio-checkpoint
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COLLAB_MODEL: ${{ vars.COLLAB_MODEL }}
          STUDIO_OWNER: ${{ vars.STUDIO_OWNER || github.repository_owner }}
        run: python3 -I -B scripts/studio/engine.py
      - name: Preserve candidate for explicit retry
        if: failure() && steps.resume.outputs.approval != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/studio-checkpoint
          key: studio-v1-${{ github.sha }}-${{ github.event.issue.number }}-${{ steps.resume.outputs.approval }}-${{ github.run_id }}-${{ github.run_attempt }}
