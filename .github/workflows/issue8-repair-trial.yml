name: Issue 8 bounded repair trial
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  replay:
    if: >-
      github.run_attempt == 1 && github.event.before == 'c34db3daf03fb57ad0a162a4de4f69f3957efdfd' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'studio/repair-from-evidence' &&
      github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read approved fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue8"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15096701201/zip" > "$RUNNER_TEMP/issue8.zip"
          echo "c51f7a509cdc1ed64e5a53f108f91c79def80ed4d3fbb3e78c108dee1b0fec0b  $RUNNER_TEMP/issue8.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/issue8.zip" candidate.json > "$RUNNER_TEMP/issue8/candidate.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15098078526/zip" > "$RUNNER_TEMP/rejected.zip"
          echo "714b49872ac709cafe0246ee09cafc448696f1186b847a18e009fd86d0bd37f1  $RUNNER_TEMP/rejected.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/rejected.zip" candidate.json > "$RUNNER_TEMP/issue8/rejected.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/7091487940" > "$RUNNER_TEMP/issue8/plan-comment.json"
      - name: Verify reproduction and offline safeguards
        run: |
          python3 scripts/studio/test_resume.py
      - name: Generate independent repair and verify all cases
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/studio/issue8_replay.py repair
      - name: Archive generated files and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-repair
          path: ${{ runner.temp }}/issue8/result/
          if-no-files-found: ignore
          retention-days: 7
      - name: Open draft for the verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base=11dd8fc11bd74e6e28b92ae83bc1e879f3fcc86b
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$base"
          gh auth setup-git
          git fetch --depth=1 origin "$base"
          branch="studio/independent-8-$GITHUB_RUN_ID"
          git switch -c "$branch" FETCH_HEAD
          cp "$RUNNER_TEMP/issue8/result/"{index.html,script.js,style.css} .
          git add -- index.html script.js style.css
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Implement independently verified issue 8 game repair'
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" --title 'Issue 8 자동 수정 검토 후보' --body "PC·모바일 시나리오 12개 및 기존 회귀 검사 통과. 승인 댓글 7091498356. 검증 기록 https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
