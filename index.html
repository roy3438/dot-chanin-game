<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>DOT CHAIN — Multi-Level Mission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="heading">
      <h1>DOT CHAIN</h1>
      <p>레벨별 미션을 클리어하는 링크 퍼즐</p>
    </header>
    <section class="stats" aria-label="게임 정보">
      <div><span>현재 점수</span><strong id="score">0</strong></div>
      <div><span>목표 점수</span><strong>2,000</strong></div>
      <div><span>남은 이동</span><strong id="moves">20</strong></div>
    </section>
    <div class="level-bar">
      <span id="level-indicator">레벨 1</span>
      <button id="mute-btn" type="button">음소거 꺼짐</button>
    </div>
    <section class="mission" aria-live="polite">
      <span class="mission-title">현재 미션 가이드</span>
      <strong id="mission-text">준비 중</strong>
      <span id="mission-bonus">보너스 +0점</span>
    </section>
    <section class="board-wrap" aria-label="6행 6열 점 연결 게임판">
      <div id="board" class="board" role="grid" aria-label="게임판"></div>
      <svg id="path-layer" class="path-layer" aria-hidden="true" preserveAspectRatio="none"><polyline id="path-line" points="" /></svg>
    </section>
    <button id="new-game" class="primary" type="button">새 게임</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <div id="result" class="result hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="result-card">
      <h2 id="result-title"></h2>
      <p>최종 점수 <strong id="final-score"></strong></p>
      <button id="restart" class="primary" type="button">다시 시작</button>
      <p id="next-mission" hidden></p>
      <button id="next-level" class="primary hidden" type="button">다음 레벨</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
