name: AI Studio Browser QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'studio/issue-') || github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium

      - name: Verify Studio browser state setup
        run: python scripts/studio/test_browser.py

      - name: Run desktop and mobile browser QA
        run: |
          if grep -Fq 'dot-chain-v1' index.html && grep -Fq 'id="path-layer"' index.html; then
            python scripts/browser_qa.py
          else
            echo 'DOT CHAIN baseline is not present; use the approved game-specific suite.'
          fi

      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-evidence
          path: qa-evidence/
          if-no-files-found: ignore
