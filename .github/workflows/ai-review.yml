name: AI Studio Source Review

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Owner request for five AI roles'
        required: true
        default: 'Review DOT CHAIN mobile usability without changing game code.'

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-studio-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TASK: ${{ inputs.task }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source review
        run: python scripts/source_review.py
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-source-review
          path: ai-source-review.md
          if-no-files-found: warn
      - name: Publish report to Issues
        if: success()
        run: gh issue create --title "AI source review - run ${{ github.run_number }}" --body-file ai-source-review.md
