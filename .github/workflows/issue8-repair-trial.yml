name: Issue 8 bounded repair trial
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  replay:
    if: >-
      github.run_attempt == 1 && github.event.before == 'fc765ce237a8c8c35213337ac03df83dd1d65f22' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'studio/repair-from-evidence' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read approved fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue8"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15096701201/zip" > "$RUNNER_TEMP/issue8.zip"
          echo "c51f7a509cdc1ed64e5a53f108f91c79def80ed4d3fbb3e78c108dee1b0fec0b  $RUNNER_TEMP/issue8.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/issue8.zip" candidate.json > "$RUNNER_TEMP/issue8/candidate.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15098078526/zip" > "$RUNNER_TEMP/rejected.zip"
          echo "714b49872ac709cafe0246ee09cafc448696f1186b847a18e009fd86d0bd37f1  $RUNNER_TEMP/rejected.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/rejected.zip" candidate.json > "$RUNNER_TEMP/issue8/rejected.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/7091487940" > "$RUNNER_TEMP/issue8/plan-comment.json"
      - name: Verify reproduction and offline safeguards
        run: |
          python3 scripts/studio/test_resume.py
      - name: Verify proposed game at immutable revision
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_SHA: c375a2ada1475d00df11d75155f3407f1521aff0
        run: |
          mkdir -p "$RUNNER_TEMP/issue8/result"
          for name in index.html script.js style.css; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$name?ref=$GAME_SHA" > "$RUNNER_TEMP/issue8/result/$name"
          done
          PYTHONPATH=scripts/studio python3 - <<'PY'
          from pathlib import Path
          import os, base64, json, engine
          folder = Path(os.environ["RUNNER_TEMP"]) / "issue8"
          comment = json.loads((folder / "plan-comment.json").read_text())
          assert comment["id"] == 7091487940 and comment["user"]["login"] == engine.BOT
          envelope = json.loads(base64.b64decode(comment["body"].split("\n    studio-data ")[-1], validate=True))
          plan = envelope["plan"]
          inventory, assets = engine.snapshot()
          engine.validate_task_plan(plan, inventory, envelope["task"])
          scope = {name for step in plan["steps"] for name in step["files"]}
          assert scope == {"index.html", "style.css", "script.js"}
          assets.update({name:(folder / "result" / name).read_bytes() for name in scope})
          full = dict(plan, dot_chain_regression=True, tests=[*plan["tests"], engine.level_two_negative(plan)])
          passed, log = engine.run_qa(assets, full)
          print(log, flush=True)
          assert passed
          PY
