name: Issue 8 bounded repair trial
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  replay:
    if: >-
      github.run_attempt == 1 && github.event.before == '776c7f80f443d8300b4748f103a38ed4f796b93b' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'studio/repair-from-evidence' &&
      github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: write
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REVISION: 379e9caafa14b184e179bbbdce335c1fd576d6c6
      GAME_BRANCH: studio/independent-8-45837161210
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read exact game revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          for file in index.html script.js style.css; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$file?ref=$REVISION" > "$RUNNER_TEMP/candidate/$file"
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/7091487940" > "$RUNNER_TEMP/plan.json"
      - name: Generate and verify on all cases
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          PYTHONPATH=scripts/studio python3 - <<'PY'
          import base64, engine, json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          comment = json.loads((temp / "plan.json").read_text())
          assert comment["id"] == 7091487940 and comment["user"]["login"] == engine.BOT
          plan = json.loads(base64.b64decode(comment["body"].split("\n    studio-data ")[-1], validate=True))["plan"]
          assets = {file.name:file.read_bytes() for file in (temp / "candidate").iterdir()}
          tests = [*plan["tests"], engine.level_two_negative(plan), *engine.level_continuity_cases()]
          full = dict(plan, tests=tests, dot_chain_regression=True)
          old = assets["script.js"].decode()
          engine.GENERATION_LIMITS["api.groq.com"] = 1
          starts = ["  function startNewGame(", "    const chainLen = selected.length;",
                    "  function clearDots(", '  if (state.phase === "finished")']
          ends = ["  function randomizeBoard(", "    // Decrease move counter",
                  "  function clearSelection(", "})();"]
          names = ["new_game", "score_and_clear", "gravity", "restore"]
          ranges = {name:(old.index(start), old.index(end, old.index(start)))
                    for name,start,end in zip(names, starts, ends)}
          schema = {"type":"object","properties":{key:{"type":"string"} for key in names},
                    "required":names,"additionalProperties":False}
          context = {key:old[start:end] for key,(start,end) in ranges.items()}
          result = engine.Groq().ask(
              "Replace each of the four supplied blocks completely, returning one JavaScript string per field. "
              "The blocks are pasted into the original file. Keep surrounding code and identifiers compatible. "
              "Every field must implement its named change. No Markdown.",
              {"blocks":context,"browser_result":
               "new_game: preserve prior mute, best and unlocked; hide the result before render and save. "
               "score_and_clear: retain level bonuses, cumulative progress and base score; call clearDots "
               "exactly once outside the level branches, including a short chain. "
               "gravity: synchronously compact each affected column toward row 5 excluding selected indices, "
               "fill from top with random COLORS, update state.board and call renderBoard and sounds.clear. "
               "Caller saves after this returns; no timer or clearing selected array here. "
               "restore: if phase is won or lost call finishGame(state.phase === 'won'); this helper "
               "displays correct title, next availability and saves. Preserve indentation.",
               "available":"state, selected, COLORS, BOARD_SIZE, renderBoard(), sounds.clear(), finishGame(victory), "
               "saveState(), updateUI(), generateMission(), clearDots(positions), addScore(delta, 0, 0), $result"},
              3800, schema=schema)
          patched = old
          for key,(start,end) in sorted(ranges.items(), key=lambda item:item[1][0], reverse=True):
              replacement = result[key]
              assert replacement.strip() and replacement.strip() != old[start:end].strip(), key
              patched = patched[:start] + replacement.rstrip() + "\n\n" + patched[end:]
          assert patched != old
          assets = engine.apply_file_response({"files":{"script.js":patched}}, {"script.js":"write"}, assets, True)
          output = temp / "repair"
          output.mkdir()
          (output / "script.js").write_bytes(assets["script.js"])
          passed, log = engine.run_qa(assets, full)
          (output / "qa.log").write_text(log, encoding="utf-8")
          print(log, flush=True)
          raise SystemExit(0 if passed else 1)
          PY
      - name: Save repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr24-verified-repair
          path: ${{ runner.temp }}/repair
          if-no-files-found: ignore
      - name: Update PR branch after full pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --depth=1 origin "refs/heads/$GAME_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$REVISION"
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/repair/script.js" script.js
          git add -- script.js
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Repair DOT CHAIN board and save continuity'
          git push origin "HEAD:refs/heads/$GAME_BRANCH"
